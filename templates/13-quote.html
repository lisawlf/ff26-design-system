<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FF26 · 13 Quote</title>
<link rel="stylesheet" href="../css/fonts.css">
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../css/ff26.css">
<style>
  body { margin: 0; background: #1a1a1a; }
  .quote__avatar { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; }
</style>
</head>
<body>

<!-- 1:1 · Testimonial. The serif does the talking here — this is the one
     layout where the serif is the largest thing on the canvas. Keep the quote
     under 22 words. -->
<div class="ff-canvas ff-canvas--1x1">
  <div class="ff-pad" style="padding: 96px var(--ff-page);">

    <p class="ff-eyebrow">What attendees say</p>

    <div class="ff-spacer"></div>

    <blockquote class="ff-lede" style="font-size: 62px; line-height: 1.1;">
      “You leave with a to-do list, not a tote bag.”
    </blockquote>

    <div class="ff-row ff-u-mt-8">
      <img class="quote__avatar" src="../assets/photos/speaker-sample.jpg" alt="">
      <div>
        <div class="ff-label">Name Surname</div>
        <div class="ff-mono ff-mono--xs ff-mono--muted ff-u-mt-2">Role · Company</div>
      </div>
    </div>

    <div class="ff-spacer"></div>

    <div class="ff-row ff-row--between" style="border-top: var(--ff-border-hairline); padding-top: var(--ff-space-6);">
      <img class="ff-logo ff-logo--sm" src="../assets/logo/ff-logo-black.png" alt="Future Forward">
      <span class="ff-metabar">26.11.2026 · Vienna</span>
    </div>

  </div>
</div>

</body>
</html>
