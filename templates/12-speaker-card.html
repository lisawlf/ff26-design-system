<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FF26 · 12 Speaker card</title>
<link rel="stylesheet" href="../css/fonts.css">
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../css/ff26.css">
<style>
  body { margin: 0; background: #1a1a1a; }
  .spk__portrait { position: relative; }
  .spk__badge { position: absolute; left: 0; bottom: 34px; }
</style>
</head>
<body>

<!-- 4:5 · Speaker announcement. Not in the launch deck, but built entirely from
     launch-deck parts: eyebrow, square portrait, acid name bar, mono role,
     serif pull-quote. Swap portrait, name, role, topic and quote. -->
<div class="ff-canvas ff-canvas--4x5">
  <div class="ff-pad" style="padding-top: 108px; padding-bottom: 64px;">

    <p class="ff-eyebrow">Speaker announcement</p>

    <div class="ff-figure ff-figure--square spk__portrait ff-u-mt-6" style="border-radius: var(--ff-radius-sm);">
      <img src="../assets/photos/speaker-sample.jpg" alt="Speaker portrait">
    </div>

    <div class="ff-u-mt-8" style="display: table;">
      <h1 class="ff-display ff-display--sm"><span class="ff-mark">Nipun Mehta</span></h1>
    </div>

    <p class="ff-mono ff-mono--md ff-mono--muted ff-u-mt-5">
      Founder, ServiceSpace &nbsp;·&nbsp; Inspiration Stage
    </p>

    <p class="ff-lede ff-lede--sm ff-u-mt-6">
      On what an economy built for <em>generosity</em> actually looks like.
    </p>

    <div class="ff-spacer"></div>

    <div><span class="ff-metabar ff-metabar--ink">26.11.2026&nbsp;|&nbsp;weXelerate, Vienna</span></div>

    <div class="ff-footer">
      <span></span>
      <img class="ff-logo ff-logo--sm ff-footer__center" src="../assets/logo/ff-logo-black.png" alt="Future Forward">
      <span class="ff-url" style="font-size: 20px;">futureforward.at</span>
    </div>

  </div>
</div>

</body>
</html>
