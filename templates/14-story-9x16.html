<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FF26 · 14 Story 9:16</title>
<link rel="stylesheet" href="../css/fonts.css">
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../css/ff26.css">
<style>
  body { margin: 0; background: #1a1a1a; }
  /* Story safe area: keep everything 250px from the top and 320px from the
     bottom so platform UI (avatar, reply bar, link sticker) never covers it. */
  .story { padding: 250px var(--ff-page) 320px; }
</style>
</head>
<body>

<!-- 9:16 · 1080×1920 · Instagram / LinkedIn story. -->
<div class="ff-canvas ff-canvas--9x16 ff-canvas--black">

  <div class="ff-bleed"><img src="../assets/photos/hero-moon.jpg" alt=""></div>
  <div class="ff-scrim ff-scrim--both"></div>

  <div class="ff-pad ff-on-photo story">

    <img class="ff-logo ff-logo--lg" src="../assets/logo/ff-logo-white.png" alt="Future Forward" style="margin: 0 auto;">

    <div class="ff-spacer"></div>

    <div class="ff-mark-lines ff-stack ff-stack--xs">
      <div><span class="ff-display ff-display--lg ff-mark-ink">We're back.</span></div>
      <div><span class="ff-display ff-display--lg ff-mark-ink">26.11.2026.</span></div>
    </div>

    <p class="ff-body ff-body--lg ff-u-mt-6">Join 1.000+ innovators, founders and leaders in Vienna.</p>

    <div class="ff-u-mt-8">
      <a class="ff-btn"><span class="ff-btn__arrow">&#8594;</span> Get your ticket</a>
    </div>

    <p class="ff-mono ff-mono--sm ff-u-mt-6">www.futureforward.at</p>

  </div>
</div>

</body>
</html>
