<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FF26 · 17 Partner wall</title>
<link rel="stylesheet" href="../css/fonts.css">
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../css/ff26.css">
<style>
  body { margin: 0; background: #1a1a1a; }
  .pw__foot { display: flex; justify-content: space-between; align-items: center; }
</style>
</head>
<body>

<!-- 4:5 · Every FF26 partner, as in the "Thank you to our partners" post.
     Earth photo, headline, white logo panel, FF + weXelerate marks.
     Tiers and logo order come from assets/partners/partners.json:
     corporate → event → supporting. Do not reorder, do not drop a partner,
     do not put the logos on the photo without the white panel. -->
<div class="ff-canvas ff-canvas--4x5 ff-canvas--navy">

  <div class="ff-bleed"><img src="../assets/photos/earth-moon.jpg" alt=""></div>
  <div class="ff-scrim" style="background: rgba(0,0,0,0.25);"></div>

  <div class="ff-pad ff-on-photo" style="padding-top: 72px; padding-bottom: 56px;">

    <p class="ff-mono ff-mono--xs" style="letter-spacing: 0.14em; text-transform: uppercase;">Future Forward 2026 &nbsp;·&nbsp; 26.11. &nbsp;·&nbsp; Vienna</p>
    <h1 class="ff-display ff-display--sm ff-u-mt-4">Thank you to<br>our partners.</h1>
    <p class="ff-body ff-u-mt-4">It takes a village to build the future.</p>

    <div class="ff-partners ff-u-mt-8">

      <div class="ff-partners__tier">
        <p class="ff-partners__label">Corporate Partners</p>
        <div class="ff-partners__grid ff-partners__grid--corporate">
          <img src="../assets/partners/corporate/01-genesys.svg" alt="Genesys">
          <img src="../assets/partners/corporate/02-ffg.webp" alt="FFG">
          <img src="../assets/partners/corporate/03-gin.svg" alt="GIN">
          <img src="../assets/partners/corporate/04-wonderful-ai.webp" alt="wonderful.ai">
        </div>
      </div>

      <div class="ff-partners__tier">
        <p class="ff-partners__label">Event Partners</p>
        <div class="ff-partners__grid ff-partners__grid--event">
          <img src="../assets/partners/event/01-vba.webp" alt="Vienna Business Agency">
          <img src="../assets/partners/event/02-vienna-region.svg" alt="Vienna Region">
          <img src="../assets/partners/event/03-uniqa-sustainable.webp" alt="UNIQA Sustainable">
          <img src="../assets/partners/event/04-embassy-of-latvia.webp" alt="Embassy of the Republic of Latvia">
          <img src="../assets/partners/event/05-liaa.webp" alt="LIAA">
          <img src="../assets/partners/event/06-unido.webp" alt="UNIDO">
          <img src="../assets/partners/event/07-aim-global.webp" alt="AIM Global">
          <img src="../assets/partners/event/08-raiffeisen-bank-international.webp" alt="Raiffeisen Bank International">
          <img src="../assets/partners/event/09-elevator-ventures.webp" alt="Elevator Ventures">
          <img src="../assets/partners/event/10-bluecode.webp" alt="Bluecode">
          <img src="../assets/partners/event/11-loom-ventures.webp" alt="Loom Ventures">
          <img src="../assets/partners/event/12-nobile.webp" alt="Nobile">
          <img src="../assets/partners/event/13-energiespeicher-oesterreich.webp" alt="Energiespeicher Österreich">
          <img src="../assets/partners/event/14-actiu.webp" alt="ACTIU">
        </div>
      </div>

      <div class="ff-partners__tier">
        <p class="ff-partners__label">Supporting Partners</p>
        <div class="ff-partners__grid ff-partners__grid--supporting">
          <img src="../assets/partners/supporting/01-the-energy-bridge.jpeg" alt="The Energy Bridge">
          <img src="../assets/partners/supporting/02-ai-austria.webp" alt="AI Austria">
          <img src="../assets/partners/supporting/03-die-presse.webp" alt="Die Presse">
          <img src="../assets/partners/supporting/04-brutkasten.webp" alt="Brutkasten">
          <img src="../assets/partners/supporting/05-b2match.webp" alt="b2match">
          <img src="../assets/partners/supporting/06-lume.webp" alt="LUME">
          <img src="../assets/partners/supporting/07-ottakringer.webp" alt="Ottakringer">
          <img src="../assets/partners/supporting/08-voeslauer.webp" alt="Vöslauer">
          <img src="../assets/partners/supporting/09-bacardi.webp" alt="Bacardi">
          <img src="../assets/partners/supporting/10-so-vienna.webp" alt="SO/ Vienna">
          <img src="../assets/partners/supporting/11-neoh.webp" alt="NEOH">
          <img src="../assets/partners/supporting/12-lemonaid.webp" alt="Lemonaid">
          <img src="../assets/partners/supporting/13-soulxcoffee.webp" alt="Soulxcoffee">
          <img src="../assets/partners/supporting/14-nucao.png" alt="NUCAO">
          <img src="../assets/partners/supporting/15-hitschies.webp" alt="Hitschies">
          <img src="../assets/partners/supporting/16-leuchtbuchstaben-at.webp" alt="Leuchtbuchstaben.at">
          <img src="../assets/partners/supporting/17-vrei.webp" alt="vrei">
          <img src="../assets/partners/supporting/18-game-city.webp" alt="Game City">
        </div>
      </div>

    </div>

    <div class="ff-spacer"></div>

    <div class="pw__foot">
      <img class="ff-logo ff-logo--sm" src="../assets/logo/ff-logo-white.png" alt="Future Forward">
      <img class="ff-logo ff-logo--sm" src="../assets/logo/wexelerate-white.png" alt="weXelerate">
    </div>

  </div>
</div>

</body>
</html>
