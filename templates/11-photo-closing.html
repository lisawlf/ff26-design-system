<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FF26 · 11 Photo closing</title>
<link rel="stylesheet" href="../css/fonts.css">
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../css/ff26.css">
<style>
  body { margin: 0; background: #1a1a1a; }
  .close__logo { position: absolute; top: 150px; left: 0; right: 0; display: flex; justify-content: center; z-index: 2; }
  .close__social { position: absolute; right: var(--ff-page); bottom: 84px; z-index: 2; }
  .ico { width: 30px; height: 30px; border-radius: 6px; display: flex; align-items: center; justify-content: center;
         font-family: var(--ff-font-display); font-weight: 700; font-size: 16px; color: #fff; }
</style>
</head>
<body>

<!-- 4:5 · Atmosphere closer. No CTA button here — the job of this slide is the
     feeling, plus the follow prompt. Pair it with a caption that carries the link. -->
<div class="ff-canvas ff-canvas--4x5 ff-canvas--black">

  <div class="ff-bleed"><img src="../assets/photos/gallery-02.jpg" alt=""></div>
  <div class="ff-scrim ff-scrim--both"></div>

  <div class="close__logo">
    <img class="ff-logo ff-logo--lg" src="../assets/logo/ff-logo-white.png" alt="Future Forward">
  </div>

  <div class="ff-pad ff-on-photo" style="justify-content: flex-end; padding: 0 var(--ff-page) 160px;">
    <div class="ff-stack ff-stack--sm">
      <div><span class="ff-metabar ff-metabar--white">26.11.2026&nbsp;|&nbsp;weXelerate, Praterstrasse 1, 1020 Vienna</span></div>
      <h1 class="ff-display ff-display--lg ff-display--bold">1.000 people.<br>One innovation hub.</h1>
      <p class="ff-body ff-body--md">This is what navigating the unknown looks like.</p>
    </div>
  </div>

  <div class="close__social ff-social ff-u-white">
    <div class="ff-social__icons">
      <span class="ico" style="background:#0A66C2;">in</span>
      <span class="ico" style="background:linear-gradient(45deg,#F9CE34,#EE2A7B,#6228D7);">&#9678;</span>
    </div>
    <div class="ff-social__text">
      <span class="ff-strong">Follow us</span><br>
      on LinkedIn &amp; Instagram<br>
      and stay tuned for the next<br>
      event announcements.
    </div>
  </div>

</div>

</body>
</html>
