<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FF26 · 15 Square announcement</title>
<link rel="stylesheet" href="../css/fonts.css">
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../css/ff26.css">
<style>
  body { margin: 0; background: #1a1a1a; }
</style>
</head>
<body>

<!-- 1:1 · 1080×1080 · Single-image announcement. The densest the system gets:
     eyebrow, headline, lede, one fact row, one CTA. Nothing else fits. -->
<div class="ff-canvas ff-canvas--1x1">
  <div class="ff-pad" style="padding: 96px var(--ff-page) 80px;">

    <p class="ff-eyebrow">Save the date</p>

    <h1 class="ff-display ff-display--lg ff-u-mt-5">
      Future<br>Forward<br><span class="ff-mark">2026.</span>
    </h1>

    <p class="ff-lede ff-lede--sm ff-u-mt-6">One full day. Infinite connections.</p>

    <div class="ff-spacer"></div>

    <div class="ff-grid ff-grid--3">
      <div class="ff-fact">
        <div class="ff-fact__over">Thursday</div>
        <div class="ff-fact__value">26.11.</div>
        <div class="ff-fact__under">2026</div>
      </div>
      <div class="ff-fact">
        <div class="ff-fact__value" style="margin-top: .5em;">1K+</div>
        <div class="ff-fact__under">attendees</div>
      </div>
      <div class="ff-fact">
        <div class="ff-fact__value" style="margin-top: .5em;">Vienna</div>
        <div class="ff-fact__under">weXelerate</div>
      </div>
    </div>

    <div class="ff-row ff-row--between ff-u-mt-8">
      <img class="ff-logo ff-logo--sm" src="../assets/logo/ff-logo-black.png" alt="Future Forward">
      <span class="ff-url" style="font-size: 22px;">www.futureforward.at</span>
    </div>

  </div>
</div>

</body>
</html>
