<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FF26 · 16 LinkedIn cover</title>
<link rel="stylesheet" href="../css/fonts.css">
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../css/ff26.css">
<style>
  body { margin: 0; background: #1a1a1a; }
  /* LinkedIn crops this banner hard on mobile and overlays the page avatar on
     the lower left. Keep type inside the middle band and off the first 380px. */
  .cover16 { padding: 0 80px 0 400px; flex-direction: row; align-items: center; justify-content: space-between; }
</style>
</head>
<body>

<!-- 1584×396 · LinkedIn page / event cover. -->
<div class="ff-canvas ff-canvas--cover ff-canvas--black">

  <div class="ff-bleed"><img src="../assets/photos/crowd.jpg" alt=""></div>
  <div class="ff-scrim ff-scrim--strong"></div>

  <div class="ff-pad ff-on-photo cover16">
    <div>
      <h1 class="ff-display" style="font-size: 52px;">Future Forward 2026</h1>
      <p class="ff-mono ff-mono--sm ff-mono--muted ff-u-mt-2">
        26.11.2026&nbsp;|&nbsp;weXelerate, Vienna&nbsp;|&nbsp;futureforward.at
      </p>
    </div>
    <img class="ff-logo" src="../assets/logo/ff-logo-white.png" alt="Future Forward">
  </div>

</div>

</body>
</html>
